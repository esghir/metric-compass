<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="570" viewBox="0 0 1280 570" role="img" aria-labelledby="title desc">
  <title id="title">Metric Compass KPI audit workflow</title>
  <desc id="desc">KPI definitions and evidence flow through an assessment, deterministic scoring, human review, approval and an improvement roadmap. Returned assessments go back for evidence correction.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker>
    <marker id="greenArrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker>
    <marker id="redArrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker>
    <style>
      .bg{fill:#f8fafc}.card{fill:#fff;stroke:#cbd5e1;stroke-width:2}.ai{fill:#f3e8ff;stroke:#a855f7}.human{fill:#dcfce7;stroke:#16a34a}.head{font:700 18px system-ui,sans-serif;fill:#0f172a}.sub{font:14px system-ui,sans-serif;fill:#475569}.title{font:700 26px system-ui,sans-serif;fill:#0f172a}.label{font:700 14px system-ui,sans-serif}.arrow{fill:none;stroke:#64748b;stroke-width:3;marker-end:url(#arrow)}.pass{fill:none;stroke:#16a34a;stroke-width:3;marker-end:url(#greenArrow)}.fail{fill:none;stroke:#dc2626;stroke-width:3;stroke-dasharray:8 6;marker-end:url(#redArrow)}
    </style>
  </defs>
  <rect class="bg" width="1280" height="570" rx="20"/>
  <text class="title" x="40" y="48">Metric Compass · Evidence to approved improvement</text>
  <g transform="translate(30 95)">
    <rect class="card" width="205" height="110" rx="14"/><text class="head" x="18" y="38">1 · Define KPI</text><text class="sub" x="18" y="66">Owner confirms formula,</text><text class="sub" x="18" y="88">target and reporting period</text>
  </g>
  <g transform="translate(280 95)">
    <rect class="card" width="205" height="110" rx="14"/><text class="head" x="18" y="38">2 · Collect evidence</text><text class="sub" x="18" y="66">Pipeline validates source,</text><text class="sub" x="18" y="88">units, period and freshness</text>
  </g>
  <g transform="translate(530 95)">
    <rect class="card" width="205" height="110" rx="14"/><text class="head" x="18" y="38">3 · Assess criteria</text><text class="sub" x="18" y="66">Auditor rates each criterion</text><text class="sub" x="18" y="88">and links supporting evidence</text>
  </g>
  <g transform="translate(780 95)">
    <rect class="card" width="205" height="110" rx="14"/><text class="head" x="18" y="38">4 · Calculate score</text><text class="sub" x="18" y="66">Versioned function applies</text><text class="sub" x="18" y="88">approved weights and rules</text>
  </g>
  <g transform="translate(1030 95)">
    <rect class="card human" width="205" height="110" rx="14"/><text class="head" x="18" y="38">5 · Review</text><text class="sub" x="18" y="66">Reviewer checks rationale,</text><text class="sub" x="18" y="88">score and evidence links</text>
  </g>
  <path class="arrow" d="M235 150 H270 M485 150 H520 M735 150 H770 M985 150 H1020"/>
  <path class="arrow" d="M1132 205 V265 H880 V300"/>
  <polygon points="880,300 965,350 880,400 795,350" fill="#fff" stroke="#94a3b8" stroke-width="2"/>
  <text class="head" x="823" y="347">Approve?</text>
  <text class="sub" x="834" y="370">evidence complete</text>
  <path class="pass" d="M965 350 H1020"/><text class="label" x="978" y="337" fill="#15803d">Yes</text>
  <g transform="translate(1030 300)">
    <rect class="card human" width="205" height="100" rx="14"/><text class="head" x="18" y="39">6 · Plan action</text><text class="sub" x="18" y="67">Create owner, due date and</text><text class="sub" x="18" y="88">dependencies for improvement</text>
  </g>
  <path class="pass" d="M1132 400 V455"/>
  <g transform="translate(1030 455)">
    <rect class="card" width="205" height="75" rx="14"/><text class="head" x="18" y="32">Monitor · report</text><text class="sub" x="18" y="56">Quiver trends and Notepad review</text>
  </g>
  <path class="fail" d="M795 350 H635 V215"/><text class="label" x="650" y="337" fill="#b91c1c">No · correct evidence or ratings</text>
</svg>
